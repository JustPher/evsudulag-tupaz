<div class="dashboard-container">
    <header class="dashboard-header">
      <h1>Advanced POS Dashboard</h1>
      <button class="logout-btn">Logout</button>
    </header>
  
    <div class="stats">
      <div class="stat-card">
        <h2>Monthly Sales</h2>
        <p>$25,000</p>
      </div>
      <div class="stat-card">
        <h2>Orders Processed</h2>
        <p>350</p>
      </div>
      <div class="stat-card">
        <h2>New Customers</h2>
        <p>120</p>
      </div>
    </div>
  
    <div class="charts">
      <div class="chart-container">
        <h2>Sales Growth</h2>
        <canvas id="salesChart"></canvas>
      </div>
      <div class="chart-container">
        <h2>Order Status</h2>
        <canvas id="ordersChart"></canvas>
      </div>
    </div>
  </div>
